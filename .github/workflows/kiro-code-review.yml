name: Kiro Code Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  kiro-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/main...HEAD | head -50)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Run Kiro code review
        id: review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          REVIEW=$(kiro-cli chat \
            --agent code-reviewer \
            --no-interactive \
            "Review these changed files for security issues, bugs, and best practice violations: ${{ steps.changed.outputs.files }}")
          echo "$REVIEW" > /tmp/raw_review.txt

      - name: Post-process output
        id: clean
        run: |
          # Strip ANSI escape characters and format for PR comment
          python3 -c "
          import re, sys
          with open('/tmp/raw_review.txt') as f:
              raw = f.read()
          # Strip ANSI escape codes
          clean = re.sub(r'\x1b\[[0-9;]*m', '', raw)
          # Remove tool invocation noise (lines starting with ⟡ or similar)
          clean = re.sub(r'^[⟡●◐].*$', '', clean, flags=re.MULTILINE)
          # Trim excessive blank lines
          clean = re.sub(r'\n{3,}', '\n\n', clean).strip()
          print(clean)
          " > /tmp/clean_review.txt
          echo "review<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/clean_review.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `## 🤖 Kiro Code Review\n\n${{ steps.clean.outputs.review }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: review
            });
